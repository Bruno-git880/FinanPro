<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanPro | Entrar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="login.css">
  <script src="login.js"></script>

</head>
<body class="bg-black-auth d-flex align-items-center justify-content-center min-vh-100">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        
        <!-- VOLTAR PARA A HOME -->
        <a href="index.html" class="text-muted-custom text-decoration-none mb-4 d-inline-block">
          <i class="fa-solid fa-arrow-left me-2"></i> Voltar para o início
        </a>

        <!-- CARD DE LOGIN -->
        <div class="card auth-card p-4 p-sm-5">
          <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-white">
              <i class="fa-solid fa-chart-line text-green me-2"></i>Finan<span class="text-green">Pro</span>
            </h1>
            <p class="text-muted-custom small mt-2">Acesse sua conta para gerenciar suas finanças</p>
          </div>

          <form id="formLogin">
            <div class="mb-3">
              <label for="email" class="form-label text-white small fw-medium">E-mail</label>
              <div class="input-group">
                <span class="input-group-text bg-dark-input border-dark-input text-muted-custom">
                  <i class="fa-regular fa-envelope"></i>
                </span>
                <input type="email" class="form-control custom-input" id="email" placeholder="seu@email.com" required>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="senha" class="form-label text-white small fw-medium mb-0">Senha</label>
                <a href="#" class="text-red small text-decoration-none">Esqueceu a senha?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-dark-input border-dark-input text-muted-custom">
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" class="form-control custom-input" id="senha" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-green-action w-100 fw-bold py-2 mb-3 shadow-green">
              Entrar
            </button>

            <div class="text-center mt-3">
              <span class="text-muted-custom small">Não tem uma conta?</span>
              <a href="cadastro.html" class="text-green fw-bold small text-decoration-none ms-1">Cadastre-se</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
